name: tests

# Run on every push to main and on every pull request, so a change can
# never reach main without the suite having passed on it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other jobs when one fails — seeing every result
      # tells you whether a break is version- or platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # macOS runners are the scarce ones, and a platform bug shows up on
        # any Python version. Test the full version matrix on Linux, and
        # just the oldest and newest supported on macOS and Windows.
        exclude:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The suite never touches the network and needs no API key, so
        # there is nothing to configure here — that is by design.
        run: python -m unittest discover -s tests -v

      - name: Check the CLI starts
        # A smoke test that catches import errors the unit tests miss,
        # since --list imports every agent and toolkit in the project.
        run: python main.py --list

      - name: Check the pipeline CLI starts
        run: python pipelines.py --list
